<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Website ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="emoji" id="emoji">💌</div>
      <div class="page-count" id="pageCount">1 / 5</div>
      <h1 id="question">Can I tell you something?</h1>
      <p class="subtext" id="subtext">Just one little question... 😊</p>

      <div class="buttons" id="buttons">
        <button class="yes" id="yesBtn">Yes ❤️</button>
        <button class="no" id="noBtn">No 🙈</button>
      </div>

      <p class="message" id="message"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
