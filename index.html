<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <main class="app">
    <section class="card">
      <div class="emoji" id="emoji">💌</div>
      <p class="page-count" id="pageCount">1 / 5</p>
      <h1 id="question">Can I tell you something?</h1>
      <p class="subtext" id="subtext">Just one little question... 😊</p>

      <div class="buttons" id="buttons">
        <button class="yes" id="yesBtn">Yes ❤️</button>
        <button class="no" id="noBtn">No 🙈</button>
      </div>

      <p class="message" id="message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
